name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Cancel any in-progress run for the same branch when a new push arrives.
# - On pull_request events: github.head_ref is the source branch name.
# - On push events: github.ref is the full ref (e.g. refs/heads/main).
# cancel-in-progress is false on the default branch so a merge to main is
# never killed by a follow-up commit mid-run; all other branches cancel freely.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# TODO(hardening, low): pin actions (actions/checkout, actions/setup-node,
# actions/cache, github/codeql-action/*) by full commit SHA instead of mutable
# major tags — standard supply-chain hardening; keep in lockstep with the same
# TODO in release.yml when addressing.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ONNXRUNTIME_NODE_SKIP_BINARIES: 1

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-and-quality includes all security-extended checks plus
          # code quality rules (dead code, common bugs, maintainability).
          queries: security-and-quality
          # Scope analysis to source; exclude generated dist/ bundles & docs.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
          # Write SARIF locally so the summary step can count findings.
          # GitHub Security tab upload still happens via the default upload:always.
          output: codeql-results

      - name: CodeQL Summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## CodeQL Security Analysis"
            echo ""
            # Authoritative signal = OPEN alerts in the Security tab (dismissals/fixes
            # applied). The raw SARIF count below counts every finding the engine
            # produced at this commit and is dismissal-UNAWARE, so it stays high even
            # when everything has been triaged — report it only as secondary context.
            # state=open filters server-side; .number emits one line per open alert
            # across all pages; wc -l totals them. Under the runner's pipefail, a gh
            # failure makes the pipe non-zero -> "?", while a genuine 0-open result
            # succeeds and yields "0".
            OPEN=$(gh api --paginate "repos/${{ github.repository }}/code-scanning/alerts?state=open&per_page=100" \
                     --jq '.[].number' 2>/dev/null | wc -l | tr -d ' ') || OPEN="?"
            SARIF=$(find codeql-results -name "*.sarif" 2>/dev/null | head -1)
            RAW="?"
            if [ -n "$SARIF" ] && [ -f "$SARIF" ]; then
              RAW=$(node -e "
                const d = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
                const n = (d.runs || []).reduce((s, r) => s + (r.results || []).length, 0);
                process.stdout.write(String(n));
              " "$SARIF" 2>/dev/null || echo "?")
            fi

            if [ "$OPEN" = "0" ]; then
              echo "OK: **0 open alerts** in the [Security tab](../../security/code-scanning)."
            elif [ "$OPEN" = "?" ]; then
              echo "_Could not query open alerts — see the [Security tab](../../security/code-scanning) for the authoritative state._"
            else
              echo "WARNING: **${OPEN} open alert(s)** — see the [Security tab](../../security/code-scanning) for details."
            fi
            echo ""
            echo "<sub>Raw findings this scan: ${RAW} (dismissal-unaware; includes already-triaged/dismissed findings — not the open count).</sub>"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        id: cache-modules
        with:
          path: node_modules
          # v2: bust caches poisoned by npm's optional-dep bug (npm/cli#4828),
          # which dropped the platform @lancedb/lancedb native binding from a
          # saved node_modules tree. See scripts/ensure-native-deps.cjs.
          key: node-modules-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - run: npm run lint
      - name: Audit Dependencies
        run: |
          # The release gate audits the PRODUCTION dependency tree only (`--omit=dev`)
          # at the `moderate` threshold. That is the surface consumers actually
          # install — the only thing a published-package security gate should block on.
          #
          # The gate (scripts/audit-gate.cjs) fails on any moderate+ advisory in the
          # shipped tree UNLESS it is explicitly allowlisted, with a reviewed
          # upstream-blocked justification, in config/tooling/audit-exceptions.json.
          # Rationale: @earendil-works/pi-coding-agent ships its own
          # npm-shrinkwrap.json, which freezes its nested transitive tree — by npm
          # design a shrinkwrap is authoritative, so downstream `overrides` cannot
          # remediate advisories inside it; a few other prod deps pin transitives the
          # same way. Those advisories are upstream-only and must not permanently
          # block releases, but every OTHER advisory still must — a raw
          # `--audit-level` threshold cannot express that; the reviewed allowlist can.
          # Full details still surface (informational) in the job summary below.
          npm audit --omit=dev --json > /tmp/audit-prod.json 2>&1 || true
          node scripts/audit-gate.cjs || AUDIT_FAILED=$?
          npm audit --json > /tmp/audit-full.json 2>&1 || true
          {
            echo "## Dependency Security Audit"
            echo ""
            node -e "
              const read = f => { try { return JSON.parse(require('fs').readFileSync(f, 'utf8')); } catch { return null; } };
              const prod = read('/tmp/audit-prod.json');
              const full = read('/tmp/audit-full.json');
              const pv = prod?.metadata?.vulnerabilities || {};
              const fv = full?.metadata?.vulnerabilities || {};
              const sev = ['critical','high','moderate','low'];
              console.log('### Production (shipped) — release gate @ moderate');
              if ((pv.total || 0) === 0) {
                console.log('OK: No vulnerabilities in production dependencies.');
              } else {
                console.log('ERROR: Production vulnerabilities found — build blocked:');
                console.log('');
                console.log('| Severity | Count |'); console.log('|---|---|');
                sev.forEach(k => { if (pv[k] > 0) console.log('| \`' + k + '\` | ' + pv[k] + ' |'); });
              }
              console.log('');
              console.log('### Full tree (incl. devDependencies) — informational, non-blocking');
              if ((fv.total || 0) === 0) {
                console.log('OK: No vulnerabilities found.');
              } else {
                console.log('| Severity | Count |'); console.log('|---|---|');
                sev.forEach(k => { if (fv[k] > 0) console.log('| \`' + k + '\` | ' + fv[k] + ' |'); });
                console.log('');
                console.log('_Dev-only advisories are frozen in the upstream shrinkwrap (pi-coding-agent) and not shipped; they do not block the gate._');
              }
            " 2>/dev/null || echo "_Audit summary unavailable — see job log._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${AUDIT_FAILED:-0}

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        id: cache-modules
        with:
          path: node_modules
          # v2: bust caches poisoned by npm's optional-dep bug (npm/cli#4828),
          # which dropped the platform @lancedb/lancedb native binding from a
          # saved node_modules tree. See scripts/ensure-native-deps.cjs.
          key: node-modules-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - run: npm run type-check
      - run: npm run type-check:tests

  unit-test:
    needs: [lint, type-check]
    # Cross-platform matrix: the unit suite must pass on the three OSes the tool
    # supports. fail-fast:false keeps each leg independent so a regression on one
    # platform never masks the others' results.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Each OS leg uses the pinned .nvmrc version (node: '' selects the file).
        node: ['']
        include:
          # package.json declares `engines.node: ">=22.19.0"`, but every job pinned
          # .nvmrc (22.19.0) — so the ONLY Node version ever tested was the floor,
          # while consumers on a newer major were unverified. One extra leg on the
          # current LTS covers the top of the declared range without tripling the
          # matrix; a break there means either the code or `engines` is wrong.
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    # Skip the browser download during `npm ci` postinstall — unit tests mock the
    # browser layer and never launch Camoufox.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    # Bound the job: a synchronous infinite loop in a test blocks vitest's own
    # testTimeout (the timer never fires), so without this a hang would run for
    # the 6h GitHub default. Windows/macOS runners are slower than Linux, so the
    # bound is generous relative to the sub-minute Linux runtime.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          # matrix.node is empty for the standard legs → fall back to .nvmrc.
          node-version: ${{ matrix.node }}
          node-version-file: ${{ matrix.node == '' && '.nvmrc' || '' }}
      - uses: actions/cache@v6
        id: cache-modules
        with:
          path: node_modules
          # runner.os is part of the key: node_modules holds platform-specific
          # native binaries, so each OS gets its own cache entry.
          # v2: bust caches poisoned by npm's optional-dep bug (npm/cli#4828),
          # which dropped the platform @lancedb/lancedb native binding from a
          # saved node_modules tree. See scripts/ensure-native-deps.cjs.
          # matrix.node is part of the key because node_modules carries native
          # bindings: without it the two ubuntu legs (pinned .nvmrc and current
          # LTS) would share one cache, and whichever ran first would decide what
          # the other tested against — defeating the point of the extra leg.
          key: node-modules-v2-${{ runner.os }}-node${{ matrix.node || 'nvmrc' }}-${{ hashFiles('package-lock.json') }}
      - if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      # Repair npm's optional-dependency bug (npm/cli#4828): a fresh `npm ci` or a
      # restored node_modules cache can be missing the platform-specific
      # @lancedb/lancedb native binding that the knowledge-store unit tests need.
      # Verifies the binding loads and installs it directly by name if it doesn't.
      - name: Ensure native bindings
        run: node scripts/ensure-native-deps.cjs
      # Always (re)build the browser worker bundle. It is gitignored and produced
      # by the `prepare` lifecycle, which only runs as part of `npm ci`. On a
      # node_modules cache HIT `npm ci` is skipped, so without this step the
      # bundle is absent and WorkerPoolManager.ensurePool()'s existsSync guard
      # fails the worker-pool-manager unit tests (the integration job already
      # builds it explicitly for the same reason).
      - run: npm run build:worker
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y
      - run: npm run test:unit

  integration-test:
    # Gate on unit-test too: the unit suite finishes in well under a minute on
    # Linux, so requiring it first gives faster failure feedback and avoids burning
    # macOS/Windows integration-runner minutes when units are already red.
    needs: [lint, type-check, unit-test]
    # Cross-platform matrix: the full integration suite (including REAL Camoufox
    # browser launches) runs on all three supported OSes. fail-fast:false keeps
    # each leg independent. On macOS/Windows no Xvfb is needed (native display);
    # Camoufox ships per-OS binaries that setup.cjs fetches during npm ci, and
    # getCamoufoxBinaryPath() resolves the per-OS install dir so the browser
    # tests actually execute there. If a binary is ever missing on a platform,
    # isBrowserAvailable() returns false and the browser tests skip gracefully
    # (the non-browser knowledge/state/config suites still run for real).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Runs the parallel and serial groups sequentially in one job to ensure
    # completeness while keeping the workflow clean.
    # 60 min: Integration tests involve real browser launches (Camoufox) and
    # complex orchestrator runs. 60 min provides plenty of headroom for
    # sequential execution and retries across the slower macOS/Windows runners.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        id: cache-modules
        with:
          path: node_modules
          # v2: bust caches poisoned by npm's optional-dep bug (npm/cli#4828),
          # which dropped the platform @lancedb/lancedb native binding from a
          # saved node_modules tree. See scripts/ensure-native-deps.cjs.
          key: node-modules-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
        # camoufox-js's postinstall fetch queries the GitHub releases API; the
        # token lifts the 60/hr unauthenticated limit that rate-limits shared
        # macOS/Windows runner IPs.
        #
        # PI_RESEARCH_STRICT_SETUP makes setup.cjs exit non-zero on a failed browser
        # install instead of degrading silently. Users must keep the graceful exit 0
        # (the browser is fetched lazily on first use), but that left the Windows and
        # macOS branches of setup.cjs with no way to fail a build — a broken launcher
        # produced a green `npm ci`. This is the one place they are enforced.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PI_RESEARCH_STRICT_SETUP: '1'
      # Repair npm's optional-dependency bug (npm/cli#4828) before the integration
      # suite, which exercises the real knowledge store (needs the @lancedb/lancedb
      # native binding). See scripts/ensure-native-deps.cjs.
      - name: Ensure native bindings
        run: node scripts/ensure-native-deps.cjs
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y
      - name: Install Firefox system dependencies (Linux)
        # apt-based; only needed/available on Linux. macOS/Windows ship the
        # libraries Camoufox needs.
        if: runner.os == 'Linux'
        run: npx playwright install-deps firefox
      # Cache the Camoufox binary on Linux only: its install dir is well-known
      # there (~/.cache/camoufox). On macOS the binary lives under
      # ~/Library/Caches/camoufox and on Windows under
      # %USERPROFILE%/AppData/Local/camoufox/camoufox/Cache; both are fetched
      # fresh (setup.cjs during npm ci, plus the prefetch step below).
      - uses: actions/cache@v6
        id: cache-camoufox
        if: runner.os == 'Linux'
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Pre-fetch Camoufox binary
        # Always fetch on macOS/Windows (not Linux-cached); on Linux only on a
        # cache miss. Idempotent — skips if the binary is already present.
        if: runner.os != 'Linux' || steps.cache-camoufox.outputs.cache-hit != 'true'
        run: npx camoufox-js fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # headless:'virtual' (opt-in Xvfb path) requires an X11 display.
      # The default Linux code path uses boolean headless:true (no X11 needed),
      # but the headless:'virtual' smoke-test below exercises the Xvfb path.
      # Xvfb is pre-installed on ubuntu-latest.
      - name: Start Xvfb virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          # Give Xvfb a moment to be ready before the browser workers start
          sleep 1
      - name: Verify camoufox launches (headless:true)
        timeout-minutes: 2
        # shell: bash so the heredoc works on Windows (Git Bash) as well as
        # Linux/macOS. A failure here on any OS is a real cross-platform browser
        # regression worth surfacing (fail-fast:false isolates the leg).
        shell: bash
        run: |
          node --input-type=module <<'NODE_EOF'
          import { Camoufox } from 'camoufox-js';
          const b = await Camoufox({ headless: true });
          await b.close();
          console.log('camoufox headless:true OK');
          NODE_EOF
      - name: Verify camoufox launches (headless:virtual — no DISPLAY, Linux only)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        # Exercises the headless:'virtual' code path that the regular integration
        # tests always bypass because DISPLAY=:99 is set earlier in this job.
        # Here we explicitly unset DISPLAY before launching so camoufox spawns
        # its own Xvfb. If camoufox-js or Xvfb regressions break this path,
        # this step catches it before the integration suite even runs.
        shell: bash
        run: |
          node --input-type=module <<'NODE_EOF'
          import { Camoufox } from 'camoufox-js';
          delete process.env['DISPLAY'];
          const b = await Camoufox({ headless: 'virtual' });
          // headless:'virtual' browser.close() is synchronous (returns void).
          b.close();
          console.log('camoufox headless:virtual OK');
          NODE_EOF
      - name: Build worker bundle
        run: npm run build:worker
      - name: Integration Tests (Parallel Group)
        run: npm run test:integration:parallel
        env:
          PI_RESEARCH_MOCK_SEARCH: "true"
          PI_RESEARCH_MOCK_SCRAPE: "true"
          PI_RESEARCH_WORKER_THREADS: "2"
          # youtube-transcript.test.ts is the only file in this group that consults
          # skipsLiveNetwork(); its live InnerTube/PoToken fetches need a residential
          # IP, so skip them here (visible ctx.skip) exactly as its header documents —
          # this mirrors the serial group below and removes a live-network flake source.
          PI_RESEARCH_SKIP_LIVE_NETWORK_TESTS: "true"
          # GitHub runners have no real GPU, so the default EMBEDDING_DEVICE=auto
          # out-of-process WebGPU probe can only ever fall back to CPU — after a slow
          # model load and a software-Vulkan crash/hang. Force CPU so the knowledge-store
          # embedder is deterministic and never blocks a test on a pointless probe.
          PI_RESEARCH_EMBEDDING_DEVICE: "cpu"
      - name: Integration Tests (Serial Group)
        run: npm run test:integration:serial
        env:
          # runner.temp is the portable per-OS temp dir (/tmp on Linux/macOS,
          # a Windows path on windows-latest) — '/tmp' does not exist on Windows.
          PI_RESEARCH_LOG_FILE: ${{ runner.temp }}/pi-workers-serial.log
          # Allow the local-scrape.test.ts loopback server to be scraped by the
          # real browser. Loopback-only; set at job scope so the worker threads
          # (where validateUrlForSSRF runs) inherit it regardless of when the
          # browser pool is first spawned.
          PI_RESEARCH_ALLOW_LOOPBACK_SCRAPE: "true"
          # No MOCK_SEARCH/MOCK_SCRAPE here: camoufox + Xvfb are installed above,
          # so isBrowserAvailable() returns true and browser tests actually execute.
          # Setting both mock vars triggers isFullMockMode() which causes all serial
          # browser tests to silently skip (false-green).
          PI_RESEARCH_WORKER_THREADS: "2"
          # Skip the live-network E2E suites (concurrent DuckDuckGo searches, deep
          # research) in CI: shared CI datacenter IPs are rate-limited/blocked by
          # search providers on concurrent bursts, so these flake here while
          # passing locally on a residential IP. ctx.skip() reports them as
          # skipped (visible), NOT as silent passes. Browser launch is still
          # exercised in CI by the "Verify camoufox launches" step and the
          # remaining real-browser serial tests (error recovery, tools, etc.).
          PI_RESEARCH_SKIP_LIVE_NETWORK_TESTS: "true"
          # No real GPU on CI runners: force CPU embedding so the store embedder never
          # runs the WebGPU probe (pointless here), which on a GPU-less host loads/crashes
          # slowly and can block a store-using test — e.g. sdk-lifecycle's quick-research
          # path. Same rationale as the parallel group above.
          PI_RESEARCH_EMBEDDING_DEVICE: "cpu"
      - name: Upload worker diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worker-logs-${{ github.run_id }}-${{ matrix.os }}
          path: ${{ runner.temp }}/pi-workers-serial.log
          if-no-files-found: ignore

  dep-graph:
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        id: cache-modules
        with:
          path: node_modules
          # v2: bust caches poisoned by npm's optional-dep bug (npm/cli#4828),
          # which dropped the platform @lancedb/lancedb native binding from a
          # saved node_modules tree. See scripts/ensure-native-deps.cjs.
          key: node-modules-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      # Validate architectural rules (fast, fails on violations)
      - name: Check dependency rules
        run: npm run deps:check
      # Regenerate the detailed dependency SVG and commit only if it changed
      - run: sudo apt-get install -y graphviz
      - run: npm run deps:generate
      - name: Commit and push docs/deps.svg
        # Skip push on fork PRs: GitHub does not grant contents:write to fork
        # workflows, so git push would fail. The dep-graph still runs and the
        # SVG is regenerated locally — we just don't commit it back.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force docs/deps.svg
          if git diff --cached --quiet; then
            echo "docs/deps.svg unchanged, nothing to commit"
          else
            git commit -m "chore(ci): regenerate docs/deps.svg (detailed module graph) [skip ci]"
            git push
          fi

  validate:
    # Matrix, not ubuntu-only: this is the ONLY job that packs the tarball, installs it
    # with the real postinstall, and executes the shipped entry points. Running it on
    # Linux alone meant the npm-generated Windows `.cmd`/`.ps1` bin shim was never
    # generated or invoked anywhere in CI, and `verify-package.cjs installed` never ran
    # off-Linux — for a package whose whole delivery contract is cross-platform.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Git Bash on the Windows runners, so the one script body below works everywhere
        # instead of needing a PowerShell transliteration that could drift from it.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        id: cache-modules
        with:
          path: node_modules
          # v2: bust caches poisoned by npm's optional-dep bug (npm/cli#4828),
          # which dropped the platform @lancedb/lancedb native binding from a
          # saved node_modules tree. See scripts/ensure-native-deps.cjs.
          key: node-modules-v2-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.cache-modules.outputs.cache-hit != 'true'
        run: npm ci --legacy-peer-deps
      - name: Validate package.json
        run: node -e "const p=require('./package.json');if(!p.name||!p.version||!p.keywords?.includes('pi-package'))process.exit(1);console.log('OK',p.name+'@'+p.version)"
      - name: Build distribution artifacts
        run: |
          npm run build:worker
          npm run build:cli
          npm run build:skill
      - name: Verify tarball manifest (required files present, no junk)
        run: node scripts/verify-package.cjs manifest
      - name: Pack real tarball
        run: |
          TAR_FILE="$(npm pack --ignore-scripts | tail -1)"
          echo "TAR_FILE=$TAR_FILE" >> "$GITHUB_ENV"
      - name: Install packed tarball in a clean project (strict, real postinstall)
        # Mirrors how a real consumer / `pi install` resolves the package:
        #  - NO --legacy-peer-deps, so a peer/ERESOLVE conflict (the class that
        #    broke the fresh install) fails CI instead of shipping.
        #  - scripts enabled so our setup.cjs postinstall is exercised and must
        #    exit 0; browser download skipped to keep it fast and deterministic.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_SKIP_BINARIES: '1'
        run: |
          WORK="$(mktemp -d)"
          cp "$TAR_FILE" "$WORK/"
          cd "$WORK"
          npm init -y >/dev/null
          npm install "./$TAR_FILE"
          echo "INSTALLED_DIR=$WORK/node_modules/@lincoln504/pi-research" >> "$GITHUB_ENV"
      - name: Verify installed package layout (entry points, bundles, worker, prompts)
        run: node scripts/verify-package.cjs installed "$INSTALLED_DIR"
      - name: Run the installed CLI (resolution smoke-test)
        # Existence checks cannot catch a resolution failure. dist/cli.mjs is built
        # with esbuild `packages: 'external'`, so every bare import resolves at
        # runtime from the CONSUMER's tree — a dependency moved to devDependencies,
        # a dropped `files` entry, or an exports subpath present only in the dev
        # tree all work in this repo and fail exactly here. Executing it is the only
        # check that exercises that boundary.
        run: |
          node "$INSTALLED_DIR/dist/cli.mjs" --version
          node "$INSTALLED_DIR/dist/cli.mjs" --help > /dev/null
          node "$INSTALLED_DIR/skills/pi-research/scripts/run.mjs" --help > /dev/null
          echo "OK: installed CLI and skill launcher both execute"
      - name: Run the generated bin shim (the path a real user invokes)
        # `node dist/cli.mjs` bypasses the shim npm writes for the "bin" field. On
        # Windows that shim is a .cmd/.ps1 pair with its own quoting and interpreter
        # resolution, and it is what `npx pi-research` and a PATH invocation actually
        # run — so it is the part most able to break without anything else noticing.
        run: |
          "$(dirname "$INSTALLED_DIR")/.bin/pi-research" --version
          echo "OK: bin shim executes"
          # On Windows the line above runs the bash wrapper npm writes, which is NOT the
          # file a cmd.exe / PowerShell user gets. pi-research.cmd is, with its own
          # quoting and interpreter resolution, so exercise it too — via cygpath, since
          # cmd.exe cannot resolve the MSYS-style path bash is using here.
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c "$(cygpath -w "$(dirname "$INSTALLED_DIR")/.bin/pi-research.cmd")" --version
            echo "OK: pi-research.cmd executes"
          fi
