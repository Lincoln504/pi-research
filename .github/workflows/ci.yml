name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Cancel any in-progress run for the same branch when a new push arrives.
# github.head_ref is set on pull_request events (the PR branch name);
# github.ref is used for push events (e.g. refs/heads/main).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run type-check
      - run: npm run type-check:tests

  unit-test:
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run test:unit

  integration-test:
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    # Serial browser-pool tests take ~21 min locally with real browsers.
    # In CI browsers are not installed so they skip gracefully; the
    # non-browser (knowledge / utility) tests finish in ~2 min.
    # The fast variant runs the parallel group concurrently with the serial
    # group, shaving ~60-120 s off the critical path.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - run: npm run test:integration:fast

  dep-graph:
    needs: [lint, type-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: sudo apt-get install -y graphviz
      - run: npm ci --legacy-peer-deps
      - run: npm run deps:generate
      - name: Commit and push docs/deps.svg
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force docs/deps.svg
          if git diff --cached --quiet; then
            echo "deps.svg unchanged, nothing to commit"
          else
            git commit -m "chore(ci): regenerate docs/deps.svg [skip ci]"
            git push
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Validate package.json
        run: node -e "const p=require('./package.json');if(!p.name||!p.version||!p.keywords?.includes('pi-package'))process.exit(1);console.log('✓',p.name+'@'+p.version)"
      - name: Verify npm package
        run: npm pack --dry-run 2>&1 | grep -q index.ts
