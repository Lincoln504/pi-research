name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Serialize releases: two tags pushed in quick succession queue instead of running
# their publish jobs in parallel. cancel-in-progress is deliberately false — a
# release already past `require-ci-green` may be mid-`npm publish`, and cancelling
# there is strictly worse than making the newer tag wait. Damage without this was
# bounded (npm rejects a duplicate version; each publish gates on its own SHA's CI),
# so this is the conventional guard rather than a fix for an observed failure.
concurrency:
  group: release
  cancel-in-progress: false

# Actions are pinned by full commit SHA (tag noted beside each pin): this
# workflow holds `id-token: write` and publishes to npm, so a repointed mutable
# tag on a compromised action would otherwise run inside the trusted-publishing
# job. Update pins by resolving the new tag to its commit SHA deliberately.

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate the ENTIRE release on the full CI workflow (ci.yml — the cross-OS unit +
  # integration matrix and the real-Camoufox suites) having SUCCEEDED for this exact
  # commit. ci.yml runs on the branch push; this release runs on the tag push — the
  # two fire in parallel, so without this gate a publish could race ahead of (or
  # ignore a failure in) the heavyweight matrix. Fails CLOSED: if CI never succeeds,
  # times out, or can't be found, the release stops. Uses only preinstalled gh + jq.
  require-ci-green:
    name: Require CI green on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the CI workflow to succeed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Release tag ${GITHUB_REF_NAME} points at commit ${SHA}."
          echo "Requiring workflow 'ci.yml' to have SUCCEEDED for this commit before publishing."
          deadline=$(( $(date +%s) + 60*60 ))
          while :; do
            # Newest ci.yml run for this exact commit. ci.yml runs on branch pushes
            # (tags are excluded there), so the run is the one from the branch that
            # carried this commit to main.
            # On failure gh prints its JSON error body to STDOUT — discard it and
            # substitute '{}' so jq always sees exactly one document and the poll
            # logs the honest "no run yet" line instead of an unknown status.
            if ! run_json="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" 2>/dev/null)"; then
              run_json='{}'
            fi
            status="$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].status // "missing"')"
            concl="$(printf '%s' "$run_json"  | jq -r '.workflow_runs[0].conclusion // ""')"
            url="$(printf '%s' "$run_json"    | jq -r '.workflow_runs[0].html_url // ""')"
            case "$status" in
              completed)
                if [ "$concl" = "success" ]; then
                  echo "CI succeeded for ${SHA}: ${url}"
                  exit 0
                fi
                echo "CI concluded '${concl}' for ${SHA}: ${url}"
                echo "Refusing to publish a commit that is not CI-green."
                exit 1
                ;;
              missing) echo "…no ci.yml run for ${SHA} yet; waiting." ;;
              *)       echo "…ci.yml status '${status}' for ${SHA}; waiting." ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out after 60m waiting for CI on ${SHA}. Failing closed."
              exit 1
            fi
            sleep 20
          done

  test-install:
    name: Build, verify, and test packed tarball install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: require-ci-green
    # No id-token here: this job runs `npm ci` with full lifecycle scripts (no
    # --ignore-scripts) against every dependency, so it must never hold the OIDC
    # trusted-publishing credential — a malicious postinstall/prepare script could
    # otherwise request one via ACTIONS_ID_TOKEN_REQUEST_TOKEN/URL and exchange it
    # for a scoped npm publish credential, bypassing every check below entirely
    # (npm's trusted-publishing verification is keyed to repo+workflow file, not
    # job name). This job now ALSO runs the full check suite (lint/audit-gate/
    # type-check/deps:check/test:unit) that used to live in `publish` — moved here
    # for the same reason: `publish` must never run `npm ci` at all (see its
    # comment), so every check that depends on node_modules has to happen in a job
    # where the credential-minting capability isn't present. The resulting tarball
    # is uploaded as an artifact; `publish` downloads and ships that exact,
    # already-vetted file without ever installing a dependency itself.
    permissions:
      contents: read
    # NOTE: deliberately NO `outputs:` here. `publish` derives the tarball name
    # from the release tag instead of trusting anything this job emits — a
    # needs-output interpolated into the credentialed job's shell would be a
    # script-injection channel from the job that runs untrusted lifecycle
    # scripts into the job that holds id-token: write (see publish's comment).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Verify tag matches version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "$VERSION" || { echo "ERROR: Tag $TAG != package.json v$VERSION"; exit 1; }

      - name: Verify version sync across artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          grep -q "\"version\": \"$VERSION\"" agent-skill/pi-research/SKILL.md || { echo "ERROR: agent-skill/pi-research/SKILL.md version != package.json v$VERSION (run 'npm version' to sync)"; exit 1; }
          echo "OK: package.json and SKILL.md both at v$VERSION"

      # Skip the camoufox/native downloads during install — the release jobs
      # never launch a browser, so a live fetch only adds latency and flake.
      - env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_SKIP_BINARIES: '1'
        run: npm ci --legacy-peer-deps
      # Self-heal the @lancedb/lancedb native binding (npm/cli#4828 can drop it),
      # mirroring the CI unit-test job. test:unit loads the binding via
      # store.initialize(), so without this a dropped binding would flake the release.
      - name: Ensure native bindings
        run: node scripts/ensure-native-deps.cjs
      # ripgrep: mirror the CI unit-test environment (the SDK grep tool shells out to
      # rg) so the unit suite runs identically here — no environment-driven flake.
      - name: Install ripgrep
        timeout-minutes: 5
        run: sudo apt-get install -y ripgrep
      # This publish gate re-runs the SAME fast, deterministic blocking checks CI
      # runs on every push to main (lint, prod-dep audit, both type-checks,
      # architectural dep rules, unit suite, tarball manifest). The heavyweight
      # cross-OS unit/integration matrix and the real-browser (Camoufox) suites live
      # in ci.yml; the require-ci-green job above BLOCKS this whole release until that
      # workflow has succeeded for the tagged commit, so the two no longer race.
      - run: npm run lint
      # Production-dependency security gate — identical to the CI lint job. Blocks the
      # publish on any moderate+ advisory in the SHIPPED tree that is not explicitly
      # allowlisted (with a reviewed upstream-blocked justification) in
      # config/tooling/audit-exceptions.json. See scripts/audit-gate.cjs.
      - name: Audit production dependencies
        run: node scripts/audit-gate.cjs
      - run: npm run type-check
      - run: npm run type-check:tests
      # Architectural dependency rules — mirrors the CI dep-graph job's gate.
      - run: npm run deps:check
      - run: npm run test:unit

      - name: Build and pack
        id: pack
        run: |
          npm run build:worker
          npm run build:cli
          npm run build:skill
          npm pack
          TAR_FILE="$(ls ./*.tgz)"
          echo "TAR_FILE=$TAR_FILE" >> "$GITHUB_ENV"

      - name: Verify tarball manifest (required files present, no junk)
        run: node scripts/verify-package.cjs manifest

      - name: Test install from tarball in clean environment
        # postinstall enabled so setup.cjs is exercised; browser download skipped
        # for speed/determinism. Strict resolution (no --legacy-peer-deps) so a
        # consumer-facing peer/ERESOLVE conflict blocks the release.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_SKIP_BINARIES: '1'
        run: |
          cd /tmp
          rm -rf pi-test-install && mkdir pi-test-install && cd pi-test-install
          npm init -y
          npm install "${{ github.workspace }}/${TAR_FILE}"
          node "${{ github.workspace }}/scripts/verify-package.cjs" installed \
            "$(pwd)/node_modules/@lincoln504/pi-research"

          # EXECUTE the installed CLI, don't just check that files exist. The
          # bundle is built with esbuild `packages: 'external'`, so every bare
          # import is resolved at runtime from the CONSUMER's tree — a dependency
          # moved to devDependencies, a dropped `files` entry, or an exports
          # subpath that only exists in the dev tree all resolve fine in this repo
          # (where the full dev tree is present) and fail only here. Without this,
          # lint, type-check, unit tests and the manifest check all pass and the
          # broken artifact ships.
          node node_modules/@lincoln504/pi-research/dist/cli.mjs --version
          node node_modules/@lincoln504/pi-research/dist/cli.mjs --help > /dev/null
          # The agent-skill launcher is the entry point coding agents actually
          # invoke, and it is a separate bundle with its own resolution logic.
          node node_modules/@lincoln504/pi-research/agent-skill/pi-research/scripts/run.mjs --help > /dev/null
          echo "OK: Install smoke-test passed (files present AND the installed CLI runs)"

      - name: Upload vetted tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarball
          path: ${{ env.TAR_FILE }}
          retention-days: 1

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test-install
    # id-token is scoped to ONLY this job — the sole job in this workflow that
    # legitimately needs the OIDC trusted-publishing credential — and this job
    # deliberately does NOT run `npm ci`, `npm install`, or any other step that
    # executes a dependency's lifecycle scripts. It only downloads the exact
    # tarball `test-install` already built, checked, and smoke-tested from a
    # trusted lockfile, and uploads that unmodified file. Publishing a tarball
    # path (rather than a package directory) does not run prepublishOnly/prepare/
    # prepack — there is no package.json lifecycle to trigger. This closes the gap
    # where the credential used to be live in the same job as an untrusted `npm
    # ci` (see the removed comment in git history / CHANGELOG for the prior shape).
    permissions:
      contents: read
      id-token: write
    steps:
      # Checkout is only for .nvmrc (setup-node's node-version-file needs it on
      # disk) — this job still never reads repository source for anything else,
      # and never runs a step that executes a dependency's lifecycle scripts.
      # persist-credentials: false since this job has no reason to write to git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'

      - name: Download vetted tarball
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: npm-tarball

      # npm >=11.5.1 ships the OIDC trusted-publishing exchange (Node 22 in
      # .nvmrc bundles npm 10, which lacks it and would hit ENEEDAUTH).
      # --ignore-scripts: this is the one command in this credentialed
      # (id-token: write) job that installs a package at all. npm (the
      # package) ships no install-time lifecycle scripts as of this writing,
      # but the job's whole design is to never run installable code here on
      # trust alone — --ignore-scripts makes that hold even if a future npm
      # release, or a compromised one, added one.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11 --ignore-scripts

      # No NODE_AUTH_TOKEN: trusted publishing authenticates via OIDC and emits
      # provenance automatically (the --provenance flag is now redundant but kept
      # to state intent explicitly). Publishing the tarball file directly (not
      # `.`) means no lifecycle scripts run and no node_modules is ever installed
      # in this credentialed job.
      #
      # The filename is DERIVED FROM THE TAG here, not taken from test-install's
      # job output: `needs.<job>.outputs.*` originates in the one job that runs
      # untrusted dependency lifecycle scripts, and interpolating it with ${{ }}
      # into this run: block would splice attacker-controllable text into the
      # shell script of the only job holding id-token: write — re-opening the
      # exact credential/untrusted-code separation this job structure exists to
      # enforce (GitHub's hardening guide lists needs-outputs as an injection
      # source). The tag (workflow trigger: v*.*.*, maintainer-pushed) fixes the
      # npm-pack name deterministically: @lincoln504/pi-research vX.Y.Z packs as
      # lincoln504-pi-research-X.Y.Z.tgz. The env: indirection keeps even the
      # ref name out of shell parsing. If the artifact does not contain exactly
      # that file, fail closed and show what it did contain.
      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAR_FILE="lincoln504-pi-research-${TAG#v}.tgz"
          if [ ! -f "$TAR_FILE" ]; then
            echo "Expected tarball $TAR_FILE not present in downloaded artifact; contents:" >&2
            ls -la >&2
            exit 1
          fi
          npm publish "$TAR_FILE" --provenance --access public
