name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# TODO(hardening, low): add a `concurrency: release` group so two tags pushed in
# quick succession can't run publish jobs in parallel. Damage today is bounded
# (npm rejects duplicate versions; each publish gates on its own SHA's CI), but a
# serializing group is the conventional guard against interleaved publishes.
#
# TODO(hardening, low): pin third-/first-party actions (actions/checkout,
# actions/setup-node, actions/upload-artifact) by full commit SHA instead of
# mutable major tags. This workflow holds `id-token: write` and publishes to npm,
# so a compromised action tag would run inside the trusted-publishing job.

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate the ENTIRE release on the full CI workflow (ci.yml — the cross-OS unit +
  # integration matrix and the real-Camoufox suites) having SUCCEEDED for this exact
  # commit. ci.yml runs on the branch push; this release runs on the tag push — the
  # two fire in parallel, so without this gate a publish could race ahead of (or
  # ignore a failure in) the heavyweight matrix. Fails CLOSED: if CI never succeeds,
  # times out, or can't be found, the release stops. Uses only preinstalled gh + jq.
  require-ci-green:
    name: Require CI green on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for the CI workflow to succeed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Release tag ${GITHUB_REF_NAME} points at commit ${SHA}."
          echo "Requiring workflow 'ci.yml' to have SUCCEEDED for this commit before publishing."
          deadline=$(( $(date +%s) + 60*60 ))
          while :; do
            # Newest ci.yml run for this exact commit. ci.yml runs on branch pushes
            # (tags are excluded there), so the run is the one from the branch that
            # carried this commit to main.
            # On failure gh prints its JSON error body to STDOUT — discard it and
            # substitute '{}' so jq always sees exactly one document and the poll
            # logs the honest "no run yet" line instead of an unknown status.
            if ! run_json="$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" 2>/dev/null)"; then
              run_json='{}'
            fi
            status="$(printf '%s' "$run_json" | jq -r '.workflow_runs[0].status // "missing"')"
            concl="$(printf '%s' "$run_json"  | jq -r '.workflow_runs[0].conclusion // ""')"
            url="$(printf '%s' "$run_json"    | jq -r '.workflow_runs[0].html_url // ""')"
            case "$status" in
              completed)
                if [ "$concl" = "success" ]; then
                  echo "CI succeeded for ${SHA}: ${url}"
                  exit 0
                fi
                echo "CI concluded '${concl}' for ${SHA}: ${url}"
                echo "Refusing to publish a commit that is not CI-green."
                exit 1
                ;;
              missing) echo "…no ci.yml run for ${SHA} yet; waiting." ;;
              *)       echo "…ci.yml status '${status}' for ${SHA}; waiting." ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out after 60m waiting for CI on ${SHA}. Failing closed."
              exit 1
            fi
            sleep 20
          done

  test-install:
    name: Test packed tarball install
    runs-on: ubuntu-latest
    needs: require-ci-green
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Verify tag matches version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "$VERSION" || { echo "ERROR: Tag $TAG != package.json v$VERSION"; exit 1; }

      - name: Build and pack
        # Skip the camoufox/native downloads during install — the release jobs
        # never launch a browser, so a live fetch only adds latency and flake.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_SKIP_BINARIES: '1'
        run: |
          npm ci --legacy-peer-deps
          npm run build:worker
          npm run build:cli
          npm run build:skill
          npm pack
          TAR_FILE="$(ls *.tgz)"
          echo "TAR_FILE=$TAR_FILE" >> $GITHUB_ENV

      - name: Verify tarball manifest (required files present, no junk)
        run: node scripts/verify-package.cjs manifest

      - name: Test install from tarball in clean environment
        # postinstall enabled so setup.cjs is exercised; browser download skipped
        # for speed/determinism. Strict resolution (no --legacy-peer-deps) so a
        # consumer-facing peer/ERESOLVE conflict blocks the release.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_SKIP_BINARIES: '1'
        run: |
          cd /tmp
          rm -rf pi-test-install && mkdir pi-test-install && cd pi-test-install
          npm init -y
          npm install "${{ github.workspace }}/${TAR_FILE}"
          node "${{ github.workspace }}/scripts/verify-package.cjs" installed \
            "$(pwd)/node_modules/@lincoln504/pi-research"
          echo "OK: Install smoke-test passed"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test-install
    steps:
      - uses: actions/checkout@v7

      # NOTE: registry-url is intentionally OMITTED here. We publish via npm
      # OIDC "Trusted Publishing" (GA since npm v11.5.1), which exchanges a
      # short-lived GitHub OIDC token for a scoped publish credential and needs
      # NO long-lived NPM_TOKEN. Crucially, passing `registry-url` to
      # actions/setup-node makes it write `_authToken=${NODE_AUTH_TOKEN}` into
      # .npmrc using the (npm-invalid) GITHUB_TOKEN — and npm only takes the
      # OIDC path when it finds NO other auth, so that injected token would
      # suppress the OIDC exchange and the publish would fail with ENEEDAUTH.
      # The `cache: 'npm'` input works without registry-url; npmjs.org is the
      # default registry, so neither `npm ci` nor `npm publish` needs it here.
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Verify tag matches version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "$VERSION" || { echo "ERROR: Tag $TAG != package.json v$VERSION"; exit 1; }

      - name: Verify version sync across artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          grep -q "\"version\": \"$VERSION\"" skills/pi-research/SKILL.md || { echo "ERROR: skills/pi-research/SKILL.md version != package.json v$VERSION (run 'npm version' to sync)"; exit 1; }
          echo "OK: package.json and SKILL.md both at v$VERSION"

      - env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_SKIP_BINARIES: '1'
        run: npm ci --legacy-peer-deps
      # Self-heal the @lancedb/lancedb native binding (npm/cli#4828 can drop it),
      # mirroring the CI unit-test job. test:unit loads the binding via
      # store.initialize(), so without this a dropped binding would flake the release.
      - name: Ensure native bindings
        run: node scripts/ensure-native-deps.cjs
      # ripgrep: mirror the CI unit-test environment (the SDK grep tool shells out to
      # rg) so the unit suite runs identically here — no environment-driven flake.
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      # This publish gate re-runs the SAME fast, deterministic blocking checks CI
      # runs on every push to main (lint, prod-dep audit, both type-checks,
      # architectural dep rules, unit suite, tarball manifest). The heavyweight
      # cross-OS unit/integration matrix and the real-browser (Camoufox) suites live
      # in ci.yml; the require-ci-green job above BLOCKS this whole release until that
      # workflow has succeeded for the tagged commit, so the two no longer race. The
      # test-install job additionally packs and installs the real tarball in a clean
      # project (mirrors CI's validate job).
      - run: npm run lint
      # Production-dependency security gate — identical to the CI lint job. Blocks the
      # publish on a moderate+ advisory in the SHIPPED tree; devDeps are excluded
      # (frozen in the upstream pi-coding-agent shrinkwrap and never shipped).
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run type-check
      - run: npm run type-check:tests
      # Architectural dependency rules — mirrors the CI dep-graph job's gate.
      - run: npm run deps:check
      - run: npm run test:unit
      - run: node scripts/verify-package.cjs manifest

      # npm >=11.5.1 ships the OIDC trusted-publishing exchange (Node 22 in
      # .nvmrc bundles npm 10, which lacks it and would hit ENEEDAUTH).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      # No NODE_AUTH_TOKEN: trusted publishing authenticates via OIDC and emits
      # provenance automatically (the --provenance flag is now redundant but kept
      # to state intent explicitly).
      - name: Publish to npm
        run: npm publish --provenance --access public
