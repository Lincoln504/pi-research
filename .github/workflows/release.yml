name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-install:
    name: Test packed tarball install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Verify tag matches version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "$VERSION" || { echo "ERROR: Tag $TAG != package.json v$VERSION"; exit 1; }

      - name: Build and pack
        # Skip the camoufox/native downloads during install — the release jobs
        # never launch a browser, so a live fetch only adds latency and flake.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_SKIP_BINARIES: '1'
        run: |
          npm ci --legacy-peer-deps
          npm run build:worker
          npm run build:cli
          npm run build:skill
          npm pack
          TAR_FILE="$(ls *.tgz)"
          echo "TAR_FILE=$TAR_FILE" >> $GITHUB_ENV

      - name: Verify tarball manifest (required files present, no junk)
        run: node scripts/verify-package.cjs manifest

      - name: Test install from tarball in clean environment
        # postinstall enabled so setup.cjs is exercised; browser download skipped
        # for speed/determinism. Strict resolution (no --legacy-peer-deps) so a
        # consumer-facing peer/ERESOLVE conflict blocks the release.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_SKIP_BINARIES: '1'
        run: |
          cd /tmp
          rm -rf pi-test-install && mkdir pi-test-install && cd pi-test-install
          npm init -y
          npm install "${{ github.workspace }}/${TAR_FILE}"
          node "${{ github.workspace }}/scripts/verify-package.cjs" installed \
            "$(pwd)/node_modules/@lincoln504/pi-research"
          echo "OK: Install smoke-test passed"

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test-install
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "$VERSION" || { echo "ERROR: Tag $TAG != package.json v$VERSION"; exit 1; }

      - name: Verify version sync across artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          grep -q "\"version\": \"$VERSION\"" skills/pi-research/SKILL.md || { echo "ERROR: skills/pi-research/SKILL.md version != package.json v$VERSION (run 'npm version' to sync)"; exit 1; }
          echo "OK: package.json and SKILL.md both at v$VERSION"

      - env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ONNXRUNTIME_NODE_SKIP_BINARIES: '1'
        run: npm ci --legacy-peer-deps
      # Self-heal the @lancedb/lancedb native binding (npm/cli#4828 can drop it),
      # mirroring the CI unit-test job. test:unit loads the binding via
      # store.initialize(), so without this a dropped binding would flake the release.
      - name: Ensure native bindings
        run: node scripts/ensure-native-deps.cjs
      - run: npm run lint
      - run: npm run type-check
      - run: npm run type-check:tests
      - run: npm run test:unit
      - run: node scripts/verify-package.cjs manifest

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm
        run: npm publish --provenance --access public
